[package]
name = "zapret-forkop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local SOCKS bridge for selective Zapret routing with Forkop"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# Router flash and RAM are small. Unwinding is kept so a panic in one
# connection task does not take down every relayed connection.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
